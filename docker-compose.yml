services:
  gods-eye-view:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GEV_PORT:-4173}:4173"
    # Compose automatically reads a project-root .env when it exists. Explicit
    # defaults keep that file optional and pass configured provider values into
    # the Vite proxy without requiring a separate secret store.
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      AISSTREAM_BOUNDING_BOXES: "${AISSTREAM_BOUNDING_BOXES:-}"
      AISSTREAM_MESSAGE_TYPES: "${AISSTREAM_MESSAGE_TYPES:-}"
      AISSTREAM_SILENCE_TIMEOUT_MS: "${AISSTREAM_SILENCE_TIMEOUT_MS:-}"
      CESIUM_ION_TOKEN: "${CESIUM_ION_TOKEN:-}"
      CCTV_AUSTIN_MAX_SOURCES: "${CCTV_AUSTIN_MAX_SOURCES:-}"
      CCTV_AUSTIN_ROWS_URL: "${CCTV_AUSTIN_ROWS_URL:-}"
      CCTV_CALTRANS_DISTRICTS: "${CCTV_CALTRANS_DISTRICTS:-}"
      CCTV_CALTRANS_MAX_SOURCES: "${CCTV_CALTRANS_MAX_SOURCES:-}"
      CCTV_FORCE_AUSTIN: "${CCTV_FORCE_AUSTIN:-}"
      CCTV_MAX_SOURCES: "${CCTV_MAX_SOURCES:-}"
      CCTV_PREFER_AUSTIN: "${CCTV_PREFER_AUSTIN:-}"
      CCTV_SOURCES_FILE: "${CCTV_SOURCES_FILE:-}"
      CCTV_SOURCES_JSON: "${CCTV_SOURCES_JSON:-}"
      CCTV_TFL_ENABLED: "${CCTV_TFL_ENABLED:-}"
      CCTV_TFL_MAX_SOURCES: "${CCTV_TFL_MAX_SOURCES:-}"
      FIRMS_MAP_KEY: "${FIRMS_MAP_KEY:-}"
      GEV_RATELIMIT_GOOGLE_PER_MIN: "${GEV_RATELIMIT_GOOGLE_PER_MIN:-}"
      GEV_RATELIMIT_OPENAI_PER_MIN: "${GEV_RATELIMIT_OPENAI_PER_MIN:-}"
      LL2_API_TOKEN: "${LL2_API_TOKEN:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_HUD_SUMMARY_MODEL: "${OPENAI_HUD_SUMMARY_MODEL:-}"
      OPENAI_REALTIME_CONTEXT_RETENTION: "${OPENAI_REALTIME_CONTEXT_RETENTION:-}"
      OPENAI_REALTIME_CONTEXT_TOKENS: "${OPENAI_REALTIME_CONTEXT_TOKENS:-}"
      OPENAI_REALTIME_MODEL: "${OPENAI_REALTIME_MODEL:-}"
      OPENAI_REALTIME_MODEL_MINI: "${OPENAI_REALTIME_MODEL_MINI:-}"
      OPENAI_REALTIME_REASONING_EFFORT: "${OPENAI_REALTIME_REASONING_EFFORT:-}"
      OPENAI_REALTIME_VOICE: "${OPENAI_REALTIME_VOICE:-}"
      OPENSKY_AUTH_MODE: "${OPENSKY_AUTH_MODE:-}"
      OPENSKY_CLIENT_ID: "${OPENSKY_CLIENT_ID:-}"
      OPENSKY_CLIENT_SECRET: "${OPENSKY_CLIENT_SECRET:-}"
      OPENSKY_PASSWORD: "${OPENSKY_PASSWORD:-}"
      OPENSKY_USERNAME: "${OPENSKY_USERNAME:-}"
      TOMTOM_API_KEY: "${TOMTOM_API_KEY:-}"
      TOMTOM_DAILY_TILE_BUDGET: "${TOMTOM_DAILY_TILE_BUDGET:-}"
      VITE_AIS_LIVE_API_URL: "${VITE_AIS_LIVE_API_URL:-/api/ais-live}"
      VITE_AIS_LIVE_LABEL_MAX_ROWS: "${VITE_AIS_LIVE_LABEL_MAX_ROWS:-}"
      VITE_AIS_LIVE_MAX_ROWS: "${VITE_AIS_LIVE_MAX_ROWS:-}"
    init: true
    restart: unless-stopped
